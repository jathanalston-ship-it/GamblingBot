appId: com.momentumlab.desktop
productName: Momentum Lab
copyright: Copyright © Momentum Lab

directories:
  output: release
  buildResources: build # electron-builder auto-discovers build/icon.* here

# What gets packed into the app bundle (asar).
files:
  - dist-electron/**/*
  - renderer/dist/**/*

# The frozen FastAPI backend (PyInstaller one-file binary) is shipped alongside
# the app and spawned by the Electron main process. Built into build/backend/
# by scripts/build_windows.ps1 before packaging (see docs/WINDOWS_INSTALLER.md).
extraResources:
  - from: build/backend
    to: backend
    filter: ["**/*"]

# Update feed for in-app auto-updates. electron-builder writes `latest.yml` +
# `*.blockmap` next to the installer and bakes `app-update.yml` into the app, so
# electron-updater (wired in electron/main.ts) can discover newer GitHub
# Releases. NOTE: the build is NOT auto-published here — the release workflow
# (.github/workflows/release.yml) runs electron-builder with `--publish never`
# and uploads the assets to the GitHub Release itself.
publish:
  provider: github
  owner: jathanalston-ship-it
  repo: GamblingBot

# --------------------------------------------------------------------------- #
# Windows (primary target)
# --------------------------------------------------------------------------- #
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: MomentumLab-Setup-${version}.${ext}
  # --- Code signing (OPTIONAL — unsigned builds are fully supported) ----------
  # Initial releases ship UNSIGNED; enabling signing later needs NO config change.
  # electron-builder signs automatically when these standard environment variables
  # are present in CI (store them as encrypted secrets, never commit them):
  #   CSC_LINK          = base64-encoded .pfx certificate (or a path/URL to it)
  #   CSC_KEY_PASSWORD  = the certificate password
  # When unset (the default), the installer is built unsigned. For EV/HSM or
  # Azure Trusted Signing, configure the relevant electron-builder fields here.
  # signingHashAlgorithms: [sha256]

nsis:
  # A tiny, friendly wizard (Welcome → Install location → Install → Finish).
  oneClick: false
  perMachine: false # per-user install → NO administrator prompt
  allowElevation: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true # tick "Launch Momentum Lab" on the final page

  # Shortcuts.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Momentum Lab

  # Icons throughout the installer/uninstaller chrome.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

  # Uninstall behaviour. Keep the user's data (trade ledger / DB) on uninstall so
  # a reinstall preserves history; the data lives in %APPDATA%\Momentum Lab and
  # can be deleted manually. Set true to wipe it on uninstall.
  deleteAppDataOnUninstall: false

# --------------------------------------------------------------------------- #
# macOS / Linux (secondary; generated from the same icon)
# --------------------------------------------------------------------------- #
mac:
  target: [dmg]
  category: public.app-category.finance
  icon: build/icon.png

linux:
  target: [AppImage]
  category: Office
  icon: build/icon.png
