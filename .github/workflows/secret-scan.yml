name: Secret Scan

# Automated secret detection — catches a NEW hardcoded secret (token, key, private
# key, credentialed URL, etc.) added in ANY future commit, in ANY file. Runs on
# every push / PR over the full git history and fails the build on a finding, so a
# secret can never silently land on the default branch.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not just the tip

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history for secrets
        # --redact: never print a detected secret into the CI log.
        # --exit-code 1: fail the job (and the build) if anything is found.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1
