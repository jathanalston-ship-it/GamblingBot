[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-research-platform"
version = "0.0.113"
description = "Systematic momentum-breakout research & trading platform for US equities."
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mrp = "momentum.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: load / scale / long-running tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly: ruff's *default* rule set grows between releases, and the
# release gate installs an unpinned ruff — an implicit default would let a ruff
# upgrade fail the gate (and block every release) with no code change.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
