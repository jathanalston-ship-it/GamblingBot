# Trade-lifecycle / thesis-reevaluation thresholds. Copy to trade_lifecycle.yaml
# to override.
#
# Every trade recommendation creates a tracked trade; every scan reevaluates all
# OPEN tracked trades against fresh data and appends an evaluation (append-only —
# history is never overwritten).
model_version: v1

# Feature derivation from bars
trend_lookback_bars: 10 # "prev" reading used for trend direction
trend_flat_band: 0.10 # relative change within ±10% counts as Flat
volume_short_window: 5
volume_long_window: 20
min_bars: 70 # bars required to derive features

# Thesis-strength normalization
conviction_drop_full: 30.0 # conviction delta of -30 maps to 0
conviction_gain_full: 15.0 # conviction delta of +15 maps to 1
atr_expansion_max: 2.5 # ATR expanded 2.5x since entry maps to 0
analog_delta_full: 0.5 # ±0.5R analog-expectancy change maps to 0..1

# Component weights (normalized by their sum)
weights:
  conviction_level: 2.0
  conviction_delta: 2.0
  momentum_trend: 1.5
  rs_trend: 1.0
  volume_trend: 0.5
  regime: 1.0
  volatility: 0.5
  analog: 0.5
  price_vs_stop: 1.0

# Health bands on thesis strength (lower bounds)
strong_strength: 75.0
stable_strength: 55.0
weakening_strength: 35.0

# Thesis stability: 1 - clamp(mean successive strength change / stability_scale)
stability_scale: 25.0
stability_window: 5

# Action cascade
exit_strength: 35.0 # thesis broken -> Exit
exit_conviction_drop: 25.0 # conviction collapsed -> Exit
scale_out_strength: 50.0 # thesis weakening -> Scale Out
raise_stop_gain_r: 1.0 # gain >= 1R with a stable thesis -> Raise Stop
lower_stop_atr_expansion: 1.75 # volatility expanded but thesis strong -> Lower Stop
allow_lower_stop: true
scale_in_strength: 80.0 # thesis strengthened -> Scale In
scale_in_conviction_gain: 5.0

# Close the tracked trade automatically when price breaches the stop.
auto_close_on_stop: true

# Take profits automatically when price reaches the plan's targets: scale out
# a fraction of the ORIGINAL position at each intermediate target and close
# the remainder at the final one.
auto_take_profit: true
target_scale_out_fraction: 0.3333333333333333

# Raise the working stop to breakeven once open profit reaches
# raise_stop_gain_r (the "Raise Stop" advice, executed; tightens only).
auto_raise_stop_to_breakeven: true

# Refuse to TAKE a trade when earnings are within this many days
# (0 = off; unknown earnings dates never block).
block_take_days_before_earnings: 0

# Warn when one sector holds this share of the open book (>= min positions).
sector_concentration_warn_share: 0.5
sector_concentration_min_positions: 3

# Prior evaluations feeding thesis stability.
history_limit: 20

# Trade Health — the trade's battery percentage (0-100). Eight explainable,
# weighted components; every point gained or lost carries its measured reason.
health_weights:
  conviction: 2.5
  trend: 2.0
  volume: 1.0
  volatility: 1.0
  regime: 1.5
  sector: 1.0
  time_decay: 1.0
  analog_confidence: 1.0

# Time decay: full health until `grace` days held, ramping to zero at `full`.
time_decay_grace_days: 20.0
time_decay_full_days: 60.0
# Analog confidence needs this many comparable trades to count fully.
analog_min_sample: 10
