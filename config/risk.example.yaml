# RISK ENGINE configuration — the heart of the platform.
# Every value here is a deliberate, auditable control.

sizing:
  method: fixed_fractional_risk  # fixed_fractional_risk | vol_target | fractional_kelly
  risk_per_trade_pct: 0.0075     # risk 0.75% of equity per trade (the 'R' unit)
  max_position_weight: 0.20      # no single name > 20% of equity (notional)
  vol_target_annual: 0.15        # used if method == vol_target
  kelly_fraction: 0.25           # used if method == fractional_kelly (capped)

stops:
  initial_atr_multiple: 2.5      # initial stop = entry - 2.5 * ATR(atr_period)
  atr_period: 20
  trailing: chandelier           # none | chandelier | breakeven_then_chandelier
  chandelier_atr_multiple: 3.0
  breakeven_at_r: 1.0            # move stop to breakeven after +1R

portfolio_limits:
  max_open_positions: 12
  max_gross_exposure: 1.0        # 1.0 = fully invested, no leverage
  max_net_exposure: 1.0
  max_sector_weight: 0.35
  max_portfolio_heat: 0.06       # total open risk capped at 6% of equity

correlation:
  enabled: true
  lookback_days: 60
  max_pairwise_correlation: 0.70 # reject a new bet too correlated with an open one
  max_cluster_positions: 4

drawdown_throttle:
  enabled: true
  # As drawdown deepens, scale risk_per_trade by these multipliers.
  tiers:
    - {drawdown_pct: 0.10, risk_multiplier: 0.75}
    - {drawdown_pct: 0.15, risk_multiplier: 0.50}
    - {drawdown_pct: 0.20, risk_multiplier: 0.25}

regime:
  enabled: true
  # Scale the per-trade risk budget by the market regime (links the regime
  # engine to sizing). A 0 multiplier means "no new entries in this regime".
  bullish_multiplier: 1.00
  neutral_multiplier: 0.50
  bearish_multiplier: 0.00

circuit_breakers:
  daily_loss_kill_switch_pct: 0.04   # halt new entries if down >4% on the day
  max_consecutive_losses: 8          # pause & alert for review
