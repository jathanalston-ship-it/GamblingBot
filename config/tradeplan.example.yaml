# Trade-plan generation. READ-ONLY — derives a plan, never places a trade.
#
# The stop multiple and the position size come from the strategy
# (config/strategy.example.yaml): stop = entry - 3 x ATR, risk 0.5% of the
# account, max 8% of the account per position. Those are the tested numbers.
model_version: v2

# stop_atr_mult: 3.0          # uncomment ONLY to override the strategy's stop
use_structural_stop: false     # true = also sit the stop below swing-low support
support_buffer_pct: 0.005

# Progress milestones in R (multiples of the initial risk). The strategy does
# NOT sell here — winners run until a close below the 50-day low.
target_r_multiples: [2.0, 4.0, 8.0]
scale_out_fractions: [0.34, 0.33, 0.33]

regime_size_factor:            # the market gate is on/off; size is not throttled
  bull: 1.0
  neutral: 1.0
  bear: 1.0

base_holding_days: 60          # typical winner hold when no history exists yet
min_holding_days: 3
time_stop_days: 10             # legacy (unused)
rvol_momentum_floor: 1.0       # legacy (unused)
