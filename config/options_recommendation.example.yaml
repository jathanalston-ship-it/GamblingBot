# Options-recommendation thresholds. Copy to options_recommendation.yaml to override.
#
# Turns an options-ELIGIBLE setup into a concrete, conservative contract
# recommendation — expiration, strike, delta, risk level, max loss, target profit
# and a suggested allocation — following a fixed preference order:
#   1. Deep ITM Calls   2. ATM Calls   3. Vertical Call Spreads
# It deliberately AVOIDS low liquidity, wide spreads, lottery contracts and
# short-dated options. Pricing is approximate (no live chain); never executes.
model_version: v1

# Selection honours the preference order Deep ITM -> ATM -> Vertical Spread.
# Deep ITM is the default; rich IV (rank >= iv_high) picks the spread, cheap IV
# (rank <= iv_low) with a large expected move (big-move score >= this) picks ATM.
atm_convexity_move_score: 0.5

# --- structure selection (preference order is enforced as the tie-break) ----- #
# Per-structure factor weights (need not sum to 1; re-normalized over used keys).
# `base` gives Deep ITM a default-preference edge so it wins on near-ties.
weights:
  deep_itm_call:
    base: 0.30
    move: 0.20
    iv: 0.15
    horizon: 0.20
    budget: 0.10
    liquidity: 0.05
  atm_call:
    move: 0.30
    iv: 0.25
    horizon: 0.15
    budget: 0.20
    liquidity: 0.10
  vertical_spread:
    iv: 0.35
    move: 0.20
    horizon: 0.15
    budget: 0.20
    liquidity: 0.10

# --- factor bands (how raw inputs map onto [0, 1] ramps) --------------------- #
bands:
  move_small: 0.06 # expected move over the hold (fraction)
  move_large: 0.30
  iv_low: 0.30 # IV rank (0..1 percentile vs the symbol's own range)
  iv_high: 0.70
  short_horizon_days: 21
  medium_horizon_days: 60
  long_horizon_days: 180
  budget_small: 500.0 # $ at risk (1R); small budget favours leverage
  budget_large: 5000.0
  liquidity_floor: 5000000.0 # underlying ADV ($) — ramp start
  liquidity_good: 50000000.0

# --- suggested moneyness / delta per structure ------------------------------ #
deltas:
  deep_itm_delta: 0.80
  atm_delta: 0.50
  spread_long_delta: 0.60
  spread_short_delta: 0.30
moneyness:
  deep_itm_moneyness: 0.12 # long strike this far below spot (deep ITM)
  spread_long_moneyness: 0.03 # spread long leg slightly ITM
spread_width:
  min_width_pct: 0.05 # short leg at least this far above the long strike
  max_width_pct: 0.30 # ...and at most this far (caps the payoff/cost)

# --- expiration selection (avoids short-dated theta/pin risk) ---------------- #
expiration:
  min_dte: 30 # hard floor — never recommend shorter-dated options
  max_dte: 120
  horizon_multiple: 1.5 # target DTE ~= horizon * this, clamped to [min, max]

# --- AVOID gates (a hard fail vetoes the recommendation) -------------------- #
gates:
  min_underlying_dollar_volume: 5000000.0 # below => options illiquid (veto)
  max_option_spread_pct: 0.10 # est. bid/ask as fraction of mid (veto if wider)
  min_long_delta: 0.40 # below => lottery contract (guarded by construction)

# --- sizing / allocation ---------------------------------------------------- #
sizing:
  max_capital_pct: 0.10 # cap premium outlay at this fraction of equity
  default_risk_budget: 1000.0
  default_equity: 100000.0
  default_horizon_days: 30

# --- pricing approximation (Brenner-Subrahmanyam ATM proxy) ----------------- #
pricing:
  atm_premium_coeff: 0.4 # C_atm ~= coeff * S * sigma * sqrt(T)
  fallback_annual_vol: 0.40 # used when neither IV nor ATR is available
