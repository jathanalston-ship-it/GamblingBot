# Momentum scanner — display features + liquidity floors.
#
# WHICH stocks are buy signals is decided by the strategy rules in
# config/strategy.example.yaml (uptrend + top-momentum rank + recent breakout).
# This file only holds the scanner's indicator windows, the liquidity floors,
# and optional extra gates (off by default — they are not part of the tested rules).
model_version: v2

ema_fast: 20
ema_mid: 50
ema_slow: 200

dollar_volume_lookback: 20       # trailing avg $-volume window (liquidity)
relative_volume_lookback: 20     # baseline window for relative volume
atr_period: 20                   # display only; the strategy's ATR sets stops
ath_lookback: null               # null = all-time high; or an int window in bars

momentum_lookbacks:              # display only; ranking uses the strategy's blend
  63: 0.4
  126: 0.3
  252: 0.3
momentum_skip: 0

top_n: null                      # cap on ranked candidates kept (null = all)

filters:
  min_price: 5.00                # price > $5
  min_dollar_volume: 20000000    # >= $20M avg daily dollar volume
  # Optional extra gates (0 / 1.0 / false = off):
  min_relative_volume: 0.0
  max_distance_from_ath: 1.0
  require_ema_fast_above_mid: false
  require_ema_mid_above_slow: false
  min_sector_rs: 0.0

weights:                         # the rank blends these; momentum-only = tested rules
  momentum: 1.0
  trend: 0.0
  ath_proximity: 0.0
  relative_volume: 0.0
  sector_rs: 0.0
